name: "Go Multi-Platform Build"
description: "Build Go binaries for multiple platforms, package them, and output file list."

inputs:
  bin_name:
    description: "Binary name (default: repo folder name)"
    required: false
  main_go:
    description: "Go main file or package (default: main.go)"
    required: false
    default: "main.go"
  version:
    description: "Version string (default: github.ref_name or 'main')"
    required: false
  add_files:
    description: "Extra files or directories to include, separated by space"
    required: false
  dist_root_path:
    description: "Output directory, default 'dist'"
    required: false
    default: "dist"
  archs:
    description: "Space-separated GOOS/GOARCH build targets (default: 'windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64')"
    required: false
  build_envs:
    description: "Extra build environment variables (default: 'CGO_ENABLED=0')"
    required: false
  build_flags:
    description: "Extra go build flags (default: -ldflags '-s -w -X main.version=${VERSION}')"
    required: false

outputs:
  gobuild_files:
    description: "Space-separated list of generated archive files (zip/tar.gz/md5/sha256)"

runs:
  using: 'node24'
  main: 'dist/index.cjs'

branding:
  icon: 'airplay'
  color: 'red'
